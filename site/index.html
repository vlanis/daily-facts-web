<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Facts</title>
    <meta name="description" content="A curated set of interesting facts, every day." />

    <!-- Home Screen / Safari -->
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Facts" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- ?v= is a cache-busting marker: BUMP IT whenever styles.css or app.js
         changes. GitHub Pages serves these with max-age=600 and an iOS
         home-screen shortcut holds them longer still, so without a new URL a
         deployed fix can sit behind a stale copy on the reader's phone.
         today.json needs no marker — app.js already fetches it no-store. -->
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="page" id="page">
      <header class="masthead">
        <p class="eyebrow">Daily Facts</p>
        <h1 class="date" id="date">&nbsp;</h1>
      </header>

      <section id="slots" class="slots" aria-live="polite"></section>

      <p class="status" id="status" hidden></p>
    </main>

    <script src="app.js?v=5" defer></script>
  </body>
</html>
