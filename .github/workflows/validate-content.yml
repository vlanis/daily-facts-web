name: Validate content

# Cheap guardrail on content edits: runs scripts/validate.mjs whenever a PR
# touches content files, so a typo can't silently break daily generation.
# Separate from the daily-generate workflow (see specs/content-management.md).

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/validate.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate content files
        run: node scripts/validate.mjs
